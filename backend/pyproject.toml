[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard]>=0.141.1,<1.0.0",
    "python-multipart<1.0.0,>=0.0.27",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "pydantic>=2.13.5",
    "emails>=1.1.2,<2.0",
    "jinja2<4.0.0,>=3.1.4",
    "alembic>=1.19.1,<2.0.0",
    "httpx<1.0.0,>=0.25.1",
    "psycopg[binary]>=3.3.6,<4.0.0",
    "sqlmodel>=0.0.46,<1.0.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "sentry-sdk[fastapi]>=2.70.0,<3.0.0",
    "pyjwt>=2.15.0,<3.0.0",
    "pwdlib[argon2,bcrypt]>=0.3.1",
    "google-api-python-client>=2.186.0,<3",
    "google-auth-oauthlib>=1.2.2,<2",
    "cryptography>=50.0.0,<51.0.0",
    "grpcio>=1.76.0,<2",
    "protobuf>=6.33.0,<7",
    "pipecat-ai[deepgram,google]>=1.0.0,<2",
    "av>=16.1.0,<17",
    "gtts>=2.5.4,<3",
    "edge-tts>=7.2.8,<7.3",
]

[dependency-groups]
dev = [
    "pytest<10.0.0,>=7.4.3",
    "mypy<3.0.0,>=1.8.0",
    "ty>=0.0.25",
    "ruff<1.0.0,>=0.2.2",
    "coverage<8.0.0,>=7.4.3",
    "grpcio-tools>=1.76.0,<2",
    "types-protobuf>=6.32.1.20260221",
    "types-grpcio>=1.0.0.20251009",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic", "integrations/youtube/proto/stream_list_pb2.*\\.py"]

[tool.ruff]
target-version = "py314"
exclude = ["alembic", "integrations/youtube/proto/stream_list_pb2*.py"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.ty.terminal]
error-on-warning = true

[tool.ty.src]
exclude = ["**/integrations/youtube/proto/stream_list_pb2*.py"]

[tool.fastapi]
entrypoint = "app.main:app"
