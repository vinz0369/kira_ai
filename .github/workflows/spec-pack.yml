name: Spec Pack Validation
on:
  push:
    paths:
      - "AGENTS.md"
      - "CODEX_START_HERE.md"
      - "README.md"
      - "docs/**"
      - ".agents/**"
      - "harness/**"
      - ".github/workflows/spec-pack.yml"
  pull_request:
    paths:
      - "AGENTS.md"
      - "CODEX_START_HERE.md"
      - "README.md"
      - "docs/**"
      - ".agents/**"
      - "harness/**"
      - ".github/workflows/spec-pack.yml"
jobs:
  spec-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate markdown/skills/scenario fixtures
        run: python harness/validate_pack.py
# Keep original template CI workflows (backend tests, frontend, Playwright). This does NOT test application.
